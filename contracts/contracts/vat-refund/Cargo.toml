[package]
name = "vat-refund"
version = "0.1.0"
edition = "2021"
publish = false
description = "On-chain VAT refund claim registry for Gemetra (Stellar/Soroban)"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
